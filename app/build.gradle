plugins {
    id 'com.android.application'
}
android {
    namespace 'com.superrouter.agentxallinone'
    compileSdk 34
    defaultConfig {
        applicationId "com.superrouter.agentxallinone"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    // 移除了 appcompat，纯原生不闪退
    compileOnly 'de.robv.android.xposed:api:82'
}
